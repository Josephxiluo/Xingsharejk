<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>活动管理 · 药品保险报销活动福利平台</title>
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body data-page="activities">
  <div class="app-shell">
    <aside class="sidebar" aria-label="后台菜单">
      <div class="brand">
        <span class="brand-mark">F</span>
        <div>
          <strong>Fily Admin</strong>
          <small>药品保险福利平台</small>
        </div>
      </div>
      <nav class="menu">
        <a data-page="dashboard" href="index.html">运营总览</a>
        <a data-page="activities" href="activities.html">活动管理</a>
        <a data-page="enrollments" href="enrollments.html">报名审核</a>
        <a data-page="claims" href="claims.html">理赔审核</a>
        <a data-page="payments" href="payments.html">打款批处理</a>
        <a data-page="members" href="members.html">会员管理</a>
        <a data-page="pharmacies" href="pharmacies.html">合作药房</a>
        <a data-page="hotline" href="hotline.html">一键热线</a>
        <a data-page="permissions" href="permissions.html">账号权限</a>
      </nav>
      <div class="sidebar-card">
        <span>DEMO 说明</span>
        <p>每个后台菜单已拆分为独立 HTML 页面，便于客户按模块确认流程与信息架构。</p>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <p class="eyebrow">运营后台 / PC 管理端</p>
          <h1>活动管理</h1>
        </div>
        <div class="top-actions">
          <button class="btn ghost">导出运营日报</button>
          <button class="btn primary">新建活动</button>
          <div class="avatar">运营</div>
        </div>
      </header>

      <section id="activities" class="panel">
        <div class="section-head">
          <div><p class="eyebrow">Activity</p><h2>活动管理</h2></div>
          <button class="btn primary">新增 / 编辑活动</button>
        </div>
        <div class="form-grid compact">
          <label>活动名称<input value="肺癌靶向药报销福利计划"></label>
          <label>活动状态<select><option>进行中</option><option>未发布</option><option>已结束</option></select></label>
          <label>活动时间<input value="2026-05-01 至 2026-12-31"></label>
          <label>活动二维码<button class="btn block">生成并下载二维码</button></label>
        </div>
        <div class="editor-preview">
          <div>
            <h3>活动图文内容</h3>
            <p>支持富文本编辑、图片上传、活动介绍、保障说明、参与流程、理赔规则、注意事项等模块维护。</p>
          </div>
          <div class="protocol-list">
            <span>已关联协议</span>
            <button>平台服务协议.pdf</button><button>个人信息告知书.pdf</button><button>活动保障计划.jpg</button>
          </div>
        </div>
      </section>
    </main>
  </div>
  <script src="assets/app.js"></script>
</body>
</html>
